[project]
name = "trubby"
version = "0.1.0"
description = "Tracking for people who don't want to track."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "pwdlib[argon2]>=0.2,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
